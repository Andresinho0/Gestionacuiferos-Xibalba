<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de Operadores - XibalbaData</title>
    
    <link rel="stylesheet" href="CSS/Menu_MAIN.css">
    
    <script src="https://kit.fontawesome.com/7f2bc339d8.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/sweetalert2@9.5.3/dist/sweetalert2.all.min.js"></script> 
    <script src="js/script.js" defer></script>
</head>
<body onload="if (verificarSesion('administrador')) { cargaoperadores(); }">
  
  <!-- Contenedor principal que empuja el footer al fondo -->
  <div class="page-content">

    <div id="header-container"></div>

    <h1 class="main-title">Listado de operadores</h1>

    <div class="panel">
      
      <div class="panel-header">
        <h2>Operadores registrados</h2>
        <a href="Nuevo_operador.html" class="add-btn">
          <i class="fa-solid fa-user-plus"></i>
          Agregar Operador
        </a>
      </div>

      <div class="table-scroll">
        <table class="tabla">
          <colgroup>
            <col width="15%">
            <col width="25%">
            <col width="30%">
            <col width="20%">
            <col width="10%">
          </colgroup>
          <thead>
            <tr>
              <th>Matrícula</th>
              <th>Nombre</th>
              <th>Correo electrónico</th>
              <th>Número de teléfono</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-operadores">
            <!-- Las filas de datos se generarán dinámicamente aquí a través de tu JS -->
          </tbody>
        </table>
      </div>

      <div class="button-container1">
        <button class="btn" onclick="menumain()" id="backBtn">
            <i class="fa-solid fa-arrow-left"></i>
            Regresar
        </button>
      </div>

    </div> <!-- /.panel -->

  </div> <!-- /.page-content -->

  <footer>
    <small>
      <i class="fa-regular fa-copyright"></i> 
      Software desarrollado por el Instituto Interamericano de Tecnología y Ciencias del Agua.
    </small>
  </footer>

</body>
</html>

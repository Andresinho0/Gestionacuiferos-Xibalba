<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear nuevo usuario - XibalbaData</title>
    
    <link rel="stylesheet" href="CSS/Menu_MAIN.css">
    
    <script src="https://kit.fontawesome.com/7f2bc339d8.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script> 
    <script src="js/script.js" defer></script>
</head>
<body>

  <div class="page-content">

    <header class="main-header">
      <a class="logo-box" title="Ir al menú principal">
        <img src="img/iitca_logo.png" class="logo-img" alt="Logo IITCA">
      </a>
      <a href="index.html" class="nav-btn">
        <i class="fa-solid fa-house"></i>
        Inicio
      </a>
    </header>

    <h1 class="main-title">Registro de personal</h1>

    <!-- Panel de cristal centrado -->
    <div class="panel" style="max-width: 850px; margin: 20px auto 40px auto;">
      
      <div class="panel-header" style="justify-content: center; margin-bottom: 30px;">
        <h2>Crear nuevo usuario</h2>
      </div>

      <!-- Formulario estructurado en CSS Grid (2 columnas) -->
      <form class="form-grid" id="registroForm" onsubmit="event.preventDefault(); registrarConVerificacion();">
        
        <div class="form-group">
          <label for="matricula">Matrícula</label>
          <input type="text" id="matricula" name="matricula" required placeholder="Ej. 2020202">
        </div>

        <div class="form-group">
          <label for="nombre">Nombre Completo</label>
          <input type="text" id="nombre" name="nombre" required placeholder="Ingresa tu nombre completo">
        </div>

        <div class="form-group">
          <label for="correo">Correo Electrónico</label>
          <input type="email" id="correo" name="email" required placeholder="ejemplo@dominio.com" autocomplete="email">
          <small id="correoEstado" style="display:block; margin-top:6px; min-height:1em; font-size:0.85em;"></small>
        </div>

        <div class="form-group">
          <label for="contrasena">Contraseña</label>
          <input type="password" id="contrasena" name="contraseña" required placeholder="Ingresa contraseña">
        </div>

        <div class="form-group">
          <label for="telefono">Número de Teléfono</label>
          <input type="tel" id="telefono" name="telefono" required placeholder="10 dígitos">
        </div>

        <div class="form-group">
          <label for="tipoUsuario">Rol de Usuario</label>
          <select id="tipoUsuario" name="tipoUsuario" required>
              <option value="administrador">Administrador</option>
              <option value="operador">Operador</option>
          </select>
        </div>

        <div class="form-group">
          <label for="Acudd">Acuífero (Opcional)</label>
          <div class="input-with-action">
            <select id="Acudd" name="Acudd">
              <option value="">Seleccione un acuífero...</option>  
            </select>
            <a href="Captura_de_acuifero.html" class="action-btn" title="Agregar nuevo acuífero">
              <i class="fa-solid fa-circle-plus"></i>
            </a>
          </div>
        </div>

        <div class="form-group">
          <label for="oodd">Organismo Operador (Opcional)</label>
          <div class="input-with-action">
            <select id="oodd" name="oodd">
              <option value="">Seleccione un organismo...</option>
            </select>
            <a href="Captura_de_OP.html" class="action-btn" title="Agregar nuevo organismo">
              <i class="fa-solid fa-circle-plus"></i>
            </a>
          </div>
        </div>

      </form>

      <div class="button-container1" style="margin-top: 35px;">
        <button type="button" class="btn " onclick="window.history.back()" id="backBtn">
          <i class="fa-solid fa-arrow-left"></i> Cancelar
        </button>
        <button type="button" class="btn" onclick="registrarConVerificacion()" id="saveBtn">
          <i class="fa-solid fa-user-check"></i> Crear Cuenta
        </button>
      </div>
        
    </div> <!-- /.panel -->

  </div> <!-- /.page-content -->

  <footer>
    <small>
      <i class="fa-regular fa-copyright"></i> 
      Software desarrollado por el Instituto Interamericano de Tecnología y Ciencias del Agua.
    </small>
  </footer>

  <!-- Scripts para cargar selects dinámicos -->
  <script>
    document.addEventListener("DOMContentLoaded", function() {
        // Cargar Acuíferos
        fetch(`${API_BASE_URL}/acuifero`)
            .then(response => {
                if (!response.ok) return [];
                return response.json();
            })
            .then(data => {
                const Acudd = document.getElementById("Acudd");
                Acudd.innerHTML = '<option value="">Seleccione un acuífero (opcional)</option>'; 
                data.forEach(item => {
                    const option = document.createElement("option");
                    option.value = item.acu_nombre;
                    option.textContent = item.acu_nombre;
                    Acudd.appendChild(option);
                });
            })
            .catch(() => {
                document.getElementById("Acudd").innerHTML = '<option value="">Sin datos de acuífero</option>';
            });

        // Cargar Organismos Operadores
        fetch(`${API_BASE_URL}/oo`)
            .then(response => {
                if (!response.ok) return [];
                return response.json();
            })
            .then(data => {
                const oodd = document.getElementById("oodd");
                oodd.innerHTML = '<option value="">Seleccione un organismo (opcional)</option>'; 
                data.forEach(item => {
                    const option = document.createElement("option");
                    option.value = item.oo_nombre;
                    option.textContent = item.oo_nombre;
                    oodd.appendChild(option);
                });
            })
            .catch(() => {
                document.getElementById("oodd").innerHTML = '<option value="">Sin datos de organismo</option>';
            });

        // Verificar el correo cuando el usuario sale del campo
        const correoInput = document.getElementById("correo");
        correoInput.addEventListener("blur", () => {
            if (correoInput.value.trim()) verificarCorreo(correoInput.value);
        });
        correoInput.addEventListener("input", () => mostrarEstadoCorreo("", ""));
    });
  </script>

  <!-- Verificación de correo electrónico -->
  <script>
    // Dominios de correo temporal / desechable más comunes
    const DOMINIOS_DESECHABLES = new Set([
        "mailinator.com", "guerrillamail.com", "guerrillamail.net", "sharklasers.com",
        "10minutemail.com", "10minutemail.net", "tempmail.com", "temp-mail.org", "temp-mail.io",
        "yopmail.com", "yopmail.net", "trashmail.com", "getnada.com", "nada.email",
        "dispostable.com", "maildrop.cc", "throwawaymail.com", "fakeinbox.com",
        "mohmal.com", "emailondeck.com", "mintemail.com", "mailnesia.com",
        "tempinbox.com", "spamgourmet.com", "moakt.com", "tmail.ws", "tmpmail.org",
        "burnermail.io", "inboxkitten.com", "mailcatch.com", "emailfake.com"
    ]);

    // Errores de escritura frecuentes -> dominio sugerido
    const CORRECCIONES_DOMINIO = {
        "gmial.com": "gmail.com", "gmai.com": "gmail.com", "gamil.com": "gmail.com",
        "gmail.co": "gmail.com", "gmail.con": "gmail.com", "gmail.cm": "gmail.com", "gnail.com": "gmail.com",
        "hotmial.com": "hotmail.com", "hotmai.com": "hotmail.com", "hotmail.con": "hotmail.com",
        "hotmail.co": "hotmail.com", "hotmal.com": "hotmail.com",
        "outlok.com": "outlook.com", "outloo.com": "outlook.com", "outlook.con": "outlook.com",
        "yaho.com": "yahoo.com", "yahoo.con": "yahoo.com", "yahooo.com": "yahoo.com",
        "iclod.com": "icloud.com", "icloud.con": "icloud.com"
    };

    const REGEX_CORREO = /^[a-zA-Z0-9.!#$%&'*+/=?^_`{|}~-]+@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)*\.[a-zA-Z]{2,}$/;

    const cacheDominios = {};

    function mostrarEstadoCorreo(mensaje, tipo) {
        const estado = document.getElementById("correoEstado");
        const colores = { ok: "#1e8e3e", error: "#d93025", info: "#5f6368" };
        estado.textContent = mensaje;
        estado.style.color = colores[tipo] || "";
    }

    // Consulta por DNS-over-HTTPS si el dominio tiene servidores de correo (registros MX)
    async function dominioRecibeCorreo(dominio) {
        if (dominio in cacheDominios) return cacheDominios[dominio];

        const proveedores = [
            `https://cloudflare-dns.com/dns-query?name=${encodeURIComponent(dominio)}&type=MX`,
            `https://dns.google/resolve?name=${encodeURIComponent(dominio)}&type=MX`
        ];

        for (const url of proveedores) {
            try {
                const resp = await fetch(url, { headers: { "Accept": "application/dns-json" } });
                if (!resp.ok) continue;
                const data = await resp.json();

                if (data.Status === 3) return (cacheDominios[dominio] = false); // NXDOMAIN: el dominio no existe
                if (data.Status !== 0) continue;

                const mx = (data.Answer || []).filter(r => r.type === 15);
                // "Null MX" (0 .) significa que el dominio declara que NO recibe correo
                const valido = mx.some(r => !/^\s*0\s+\.?\s*$/.test(r.data));
                return (cacheDominios[dominio] = valido);
            } catch (e) {
                // Intentar con el siguiente proveedor
            }
        }
        return null; // No se pudo comprobar (sin conexión al servicio DNS)
    }

    /**
     * Verifica el correo y devuelve { valido: boolean, mensaje: string, sugerencia?: string }
     */
    async function verificarCorreo(valor) {
        const correo = (valor || "").trim().toLowerCase();

        if (!REGEX_CORREO.test(correo) || correo.includes("..")) {
            const r = { valido: false, mensaje: "El formato del correo no es válido." };
            mostrarEstadoCorreo(r.mensaje, "error");
            return r;
        }

        const dominio = correo.split("@")[1];

        if (CORRECCIONES_DOMINIO[dominio]) {
            const sugerencia = correo.split("@")[0] + "@" + CORRECCIONES_DOMINIO[dominio];
            const r = { valido: false, mensaje: `¿Quisiste decir ${sugerencia}?`, sugerencia };
            mostrarEstadoCorreo(r.mensaje, "error");
            return r;
        }

        if (DOMINIOS_DESECHABLES.has(dominio)) {
            const r = { valido: false, mensaje: "No se permiten correos temporales o desechables." };
            mostrarEstadoCorreo(r.mensaje, "error");
            return r;
        }

        mostrarEstadoCorreo("Verificando dominio del correo...", "info");
        const recibe = await dominioRecibeCorreo(dominio);

        if (recibe === false) {
            const r = { valido: false, mensaje: `El dominio "${dominio}" no existe o no puede recibir correos.` };
            mostrarEstadoCorreo(r.mensaje, "error");
            return r;
        }

        if (recibe === null) {
            const r = { valido: true, mensaje: "No se pudo comprobar el dominio; se validó solo el formato." };
            mostrarEstadoCorreo(r.mensaje, "info");
            return r;
        }

        const r = { valido: true, mensaje: "Correo verificado." };
        mostrarEstadoCorreo(r.mensaje, "ok");
        return r;
    }

    let registroEnCurso = false;

    async function registrarConVerificacion() {
        if (registroEnCurso) return;
        const correoInput = document.getElementById("correo");
        const saveBtn = document.getElementById("saveBtn");

        if (!correoInput.value.trim()) {
            crearcuenta(); // deja que crearcuenta muestre la alerta de campos incompletos
            return;
        }

        registroEnCurso = true;
        saveBtn.disabled = true;
        try {
            const resultado = await verificarCorreo(correoInput.value);

            if (!resultado.valido) {
                if (resultado.sugerencia) {
                    const { isConfirmed } = await Swal.fire({
                        icon: "question",
                        title: "Revisa tu correo",
                        text: resultado.mensaje,
                        showCancelButton: true,
                        confirmButtonText: "Sí, corregir",
                        cancelButtonText: "No, editar",
                        confirmButtonColor: "#004982"
                    });
                    if (isConfirmed) {
                        correoInput.value = resultado.sugerencia;
                        await verificarCorreo(resultado.sugerencia);
                    }
                } else {
                    Swal.fire({
                        icon: "error",
                        title: "Correo no válido",
                        text: resultado.mensaje,
                        confirmButtonColor: "#004982"
                    });
                }
                correoInput.focus();
                return;
            }

            correoInput.value = correoInput.value.trim().toLowerCase();
            crearcuenta();
        } finally {
            registroEnCurso = false;
            saveBtn.disabled = false;
        }
    }
  </script>

</body>
</html>

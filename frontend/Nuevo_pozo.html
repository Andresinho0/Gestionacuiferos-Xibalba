<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Nuevo Pozo - XibalbaData</title>
    
    <link rel="stylesheet" href="CSS/Menu_MAIN.css">
    
    <script src="https://kit.fontawesome.com/7f2bc339d8.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/sweetalert2@9.5.3/dist/sweetalert2.all.min.js"></script> 
    <script src="js/script.js" defer></script>
</head>
<body>

  <div class="page-content">

    <!-- Header estandarizado -->
    <div id="header-container"></div>

    <h1 class="main-title">Agregar nuevo pozo</h1>

    <div class="panel">
      
      <div class="panel-header" style="border-bottom: none; margin-bottom: 0;">
        <h2>Captura de parámetros del pozo</h2>
      </div>

      <!-- Contenedor Grid de Tarjetas -->
      <div class="cards-grid">
          
        <!-- TARJETA 1: Datos Generales -->
        <div class="tarjeta">
            <h3 class="tarjeta-titulo"><i class="fa-solid fa-passport"></i> 1. Datos Generales</h3>
            
            <div class="form-group">
                <label for="nombrePozo">Nombre del Pozo</label>
                <input type="text" id="nombrePozo" placeholder="Ej. Pozo Norte" required>
            </div>
            
            <div class="form-group">
                <label for="clavePozo">Clave</label>
                <input type="text" id="clavePozo" placeholder="Ej. PZ-01" required>
            </div>
            
            <div class="form-group">
                <label for="ramal">Ramal</label>
                <input type="text" id="ramal" placeholder="Ej. Ramal Oriente">
            </div>
            
            <div class="form-group">
                <label for="ubicacion">Ubicación</label>
                <input type="text" id="ubicacion" placeholder="Coordenadas o dirección">
            </div>
        </div>

        <!-- TARJETA 2: Dimensiones y Perforación -->
        <div class="tarjeta">
            <h3 class="tarjeta-titulo"><i class="fa-solid fa-ruler-combined"></i> 2. Características Físicas</h3>
            
            <div class="form-group slider-container">
                <label for="profundidad">Profundidad de perforación</label>
                <input type="range" min="30" max="250" value="50" class="slider" id="profundidad">
                <div class="slider-value">Valor: <b id="valorProfundidad" style="color: #001182;">50</b> m</div>
            </div>

            <div class="form-group slider-container">
                <label for="diametroPerforacion">Diámetro de perforación</label>
                <input type="range" min="10" max="40" value="20" class="slider" id="diametroPerforacion">
                <div class="slider-value">Valor: <b id="valorDiametroPerforacion" style="color: #001182;">20</b> in</div>
            </div>

            <div class="form-group slider-container">
                <label for="diametroADEME">Diámetro de ADEME</label>
                <input type="range" min="10" max="40" value="20" class="slider" id="diametroADEME">
                <div class="slider-value">Valor: <b id="valorDiametroADEME" style="color: #001182;">20</b> in</div>
            </div>
        </div>

        <!-- TARJETA 3: Equipamiento y Distribución -->
        <div class="tarjeta">
            <h3 class="tarjeta-titulo"><i class="fa-solid fa-bolt"></i> 3. Equipamiento y Aportes</h3>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div class="form-group" style="grid-column: span 2;">
                    <label for="subestacion">Subestación</label>
                    <input type="text" id="subestacion" placeholder="Ej. Sub-01">
                </div>
                
                <div class="form-group" style="grid-column: span 2;">
                    <label for="circuito">Circuito Eléctrico</label>
                    <input type="text" id="circuito" placeholder="Ej. Circuito A">
                </div>

                <div class="form-group">
                    <label for="aportaAcueducto">Aporta a acueducto</label>
                    <select id="aportaAcueducto">
                        <option value="No">No</option>
                        <option value="Si">Sí</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="aportaComunidad">Aporta a comunidad</label>
                    <select id="aportaComunidad">
                        <option value="No">No</option>
                        <option value="Si">Sí</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="aportaRiego">Aporta a riego</label>
                    <select id="aportaRiego">
                        <option value="No">No</option>
                        <option value="Si">Sí</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="paCdmx">P.A. CDMX</label>
                    <select id="paCdmx">
                        <option value="No">No</option>
                        <option value="Si">Sí</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="telemetria">Telemetría</label>
                    <select id="telemetria">
                        <option value="No">No</option>
                        <option value="Si">Sí</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="utr">UTR</label>
                    <select id="utr">
                        <option value="No">No</option>
                        <option value="Si">Sí</option>
                    </select>
                </div>
            </div>
        </div>

      </div> <!-- /.cards-grid -->

      <!-- Botones de Acción -->
      <div class="button-container1">
        <button class="btn" onclick="listadopozos()" id="backBtn">
          <i class="fa-solid fa-arrow-left"></i> Regresar
        </button>
        <button class="btn" onclick="guardarPozo()" id="forwardBtn">
          <i class="fa-solid fa-floppy-disk"></i> Guardar Pozo
        </button>
      </div>

    </div> <!-- /.panel -->

  </div> <!-- /.page-content -->

  <footer>
    <small>
      <i class="fa-regular fa-copyright"></i> 
      Software desarrollado por el Instituto Interamericano de Tecnología y Ciencias del Agua.
    </small>
  </footer>

  <script>
    // Actualizar el valor de los sliders en tiempo real
    function actualizarValorSlider(sliderId, valorId) {
        const slider = document.getElementById(sliderId);
        const valor = document.getElementById(valorId);
        if(!slider || !valor) return;
        
        valor.textContent = slider.value;
        slider.oninput = function() {
            valor.textContent = this.value;
        };
    }

    actualizarValorSlider('profundidad', 'valorProfundidad');
    actualizarValorSlider('diametroPerforacion', 'valorDiametroPerforacion');
    actualizarValorSlider('diametroADEME', 'valorDiametroADEME');

    // Función principal para guardar
    function guardarPozo() {
        const clavePozo = document.getElementById('clavePozo').value.trim();
        const nombrePozo = document.getElementById('nombrePozo').value.trim();

        if (!clavePozo || !nombrePozo) {
            Swal.fire({
                icon: 'warning',
                title: 'Campos requeridos',
                text: 'Por favor, complete al menos la Clave y el Nombre del pozo.',
            });
            return;
        }

        // Crear el objeto con TODOS los campos de las 3 tarjetas
        const pozoData = {
            l_poz_clave: clavePozo,
            lp_Nombre: nombrePozo,
            lp_ramal: document.getElementById('ramal').value.trim(),
            lp_ubicación: document.getElementById('ubicacion').value.trim(),
            
            lp_Profundidad_perforación: parseInt(document.getElementById('profundidad').value),
            lp_Diámetro_perforación: parseInt(document.getElementById('diametroPerforacion').value),
            lp_Diámetro_ADEME: parseInt(document.getElementById('diametroADEME').value),
            
            lp_subestacion: document.getElementById('subestacion').value.trim(),
            lp_circuito_electrico: document.getElementById('circuito').value.trim(),
            lp_aporta_acueducto: document.getElementById('aportaAcueducto').value,
            lp_aporta_comunidad: document.getElementById('aportaComunidad').value,
            lp_aporta_riego: document.getElementById('aportaRiego').value,
            lp_pa_cdmx: document.getElementById('paCdmx').value,
            lp_telemetria: document.getElementById('telemetria').value,
            lp_utr: document.getElementById('utr').value
        };

        // Enviar los datos usando la variable global de script.js (o fallback a localhost si prefieres)
        const baseUrl = typeof API_BASE_URL !== 'undefined' ? API_BASE_URL : 'http://localhost:8080/api';

        fetch(`${baseUrl}/lista_pozos`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(pozoData)
        })
        .then(response => {
            if(!response.ok) throw new Error("Error al guardar en el servidor");
            return response.json();
        })
        .then(data => {
            Swal.fire({
                icon: 'success',
                title: '¡Pozo Registrado!',
                text: 'El nuevo pozo se ha guardado correctamente en la base de datos.',
                confirmButtonColor: '#004982'
            }).then(() => {
                document.location = 'Listado_pozos.html';
            });
        })
        .catch(error => {
            console.error('Error al guardar el pozo:', error);
            Swal.fire({
                icon: 'error',
                title: '¡Error!',
                text: 'Hubo un problema al guardar el pozo. Verifica la conexión con el servidor.',
            });
        });
    }
  </script>

</body>
</html>

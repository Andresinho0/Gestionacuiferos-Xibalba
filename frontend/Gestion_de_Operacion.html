<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Operación - XibalbaData</title>

    <!-- Hojas de estilo -->
    <link rel="stylesheet" href="CSS/Menu_MAIN.css">
    
    <!-- Librerías de iconos y alertas -->
    <script src="https://kit.fontawesome.com/7f2bc339d8.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/sweetalert2@9.5.3/dist/sweetalert2.all.min.js"></script> 
    
    <!-- Scripts propios -->
    <script src="js/script.js" defer></script>

    <style>
        /* Contenedor Grid para organizar las tarjetas de registros */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            margin-top: 20px;
            margin-bottom: 30px;
        }

        /* Estilos de la tarjeta individual */
        .registro-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            overflow: hidden;
        }

        .registro-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 73, 130, 0.15);
        }

        /* Encabezado de la tarjeta */
        .registro-header {
            background: #f8fafc;
            padding: 15px 20px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .registro-header h3 {
            margin: 0;
            color: #004982;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge-actividad {
            background: #004982;
            color: white;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 300;
            text-transform: uppercase;
        }

        /* Cuerpo de la tarjeta */
        .registro-body {
            padding: 20px;
            flex-grow: 1;
        }

        .input-datetime {
            width: 100%;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            font-family: inherit;
            color: #004982;
            outline: none;
            box-sizing: border-box;
        }

        /* Pie de la tarjeta con acciones */
        .registro-footer {
            background: #f1f5f9;
            padding: 15px 20px;
            border-top: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-ver {
            color: #004982;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s;
        }

        .btn-ver:hover {
            color: #0284c7;
        }

        .acciones a {
            font-size: 1.25rem;
            margin-left: 12px;
            transition: transform 0.2s ease;
            display: inline-block;
        }

        .acciones a:hover {
            transform: scale(1.15);
        }

        .icon-accept { color: #28a745; }
        .icon-cancel { color: #dc3545; }
        .icon-edit { color: #004982; }

    </style>
</head>
<body onload="cargaoperaciones()">

  <!-- Contenedor flexible principal -->
  <div class="page-content">

    <!-- Header dinámico -->
    <div id="header-container"></div>

    <!-- Título principal -->
    <h1 class="main-title">Gestión de operación</h1>

    <!-- Contenedor Glassmorphism (Panel estilo cristal) -->
    <div class="panel">
      
      <div class="panel-header" style="border-bottom: 2px solid rgba(255, 255, 255, 0.2); padding-bottom: 15px;">
        <h2>Datos de operación</h2>
        <a href="Agregar_registro_operacion.html" class="add-btn">
          <i class="fa-solid fa-square-plus"></i> Nueva operación
        </a>
      </div>

      <!-- Contenedor Grid en lugar de la tabla -->
      <div class="cards-grid"> 
        <!-- Tarjeta de ejemplo (Reemplaza al antiguo <tr>) -->
        <div class="registro-card"></div> 
      </div> <!-- /.cards-grid -->

  
      <div class="button-container1">
        <button class="btn" onclick="menumain()" id="backBtn">
            <i class="fa-solid fa-arrow-left"></i> Regresar
        </button>
      </div>

    </div> <!-- /.panel -->

  </div> <!-- /.page-content -->

  <!-- Pie de página estandarizado -->
  <footer>
    <small>
      <i class="fa-regular fa-copyright"></i> 
      Software desarrollado por el Instituto Interamericano de Tecnología y Ciencias del Agua.
    </small>
  </footer>

</body>
</html>

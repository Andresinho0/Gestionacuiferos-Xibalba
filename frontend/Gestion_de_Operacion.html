<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Operación - XibalbaData</title>

    <!-- Hojas de estilo -->
    <link rel="stylesheet" href="CSS/Menu_MAIN.css">
    
    <!-- Librerías de iconos y alertas -->
    <script src="https://kit.fontawesome.com/7f2bc339d8.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/sweetalert2@9.5.3/dist/sweetalert2.all.min.js"></script> 
    
    <!-- Scripts propios -->
    <script src="js/script.js" defer></script>

    <style>
        /* Contenedor Grid para organizar las tarjetas de registros */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            margin-top: 20px;
            margin-bottom: 30px;
        }

        /* Estilos de la tarjeta individual */
        .registro-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            overflow: hidden;
        }

        .registro-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 73, 130, 0.15);
        }

        /* Encabezado de la tarjeta */
        .registro-header {
            background: #f8fafc;
            padding: 15px 20px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .registro-header h3 {
            margin: 0;
            color: #004982;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge-actividad {
            background: #004982;
            color: white;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 300;
            text-transform: uppercase;
        }

        /* Cuerpo de la tarjeta */
        .registro-body {
            padding: 20px;
            flex-grow: 1;
        }
        
        .detail-group {
            margin-bottom: 15px;
        }

        .detail-group:last-child {
            margin-bottom: 0;
        }

        .detail-label {
            display: block;
            font-size: 0.8rem;
            color: #64748b;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .detail-value {
            display: block;
            font-size: 1rem;
            color: #0f172a;
            font-weight: 500;
        }

        .input-datetime {
            width: 100%;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            font-family: inherit;
            color: #004982;
            outline: none;
            box-sizing: border-box;
        }

        /* Pie de la tarjeta con acciones */
        .registro-footer {
            background: #f1f5f9;
            padding: 15px 20px;
            border-top: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-ver {
            color: #004982;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s;
        }

        .btn-ver:hover {
            color: #0284c7;
        }

        .acciones a {
            font-size: 1.25rem;
            margin-left: 12px;
            transition: transform 0.2s ease;
            display: inline-block;
        }

        .acciones a:hover {
            transform: scale(1.15);
        }

        .icon-accept { color: #28a745; }
        .icon-cancel { color: #dc3545; }
        .icon-edit { color: #004982; }

    </style>
</head>
<body>

  <!-- Contenedor flexible principal -->
  <div class="page-content">

    <!-- Header dinámico -->
    <div id="header-container"></div>

    <!-- Título principal -->
    <h1 class="main-title">Gestión de operaciones del pozo</h1>

    <!-- Contenedor Glassmorphism (Panel estilo cristal) -->
    <div class="panel">
      
      <div class="panel-header" style="border-bottom: 2px solid rgba(255, 255, 255, 0.2); padding-bottom: 15px;">
        <h2>Operaciones pendientes</h2>
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
          <a href="Historial_operacion.html" class="add-btn" id="link-historial">
            <i class="fa-solid fa-clock-rotate-left"></i> Ver historial de este pozo
          </a>
          <a href="Agregar_registro_operacion.html" class="add-btn">
            <i class="fa-solid fa-square-plus"></i> Nueva operación
          </a>
        </div>
      </div>

      <!-- Contenedor Grid en lugar de la tabla -->
      <div class="cards-grid"> 
        <!-- Las tarjetas dinámicas se inyectarán aquí -->
      </div> <!-- /.cards-grid -->

      <div class="button-container1">
        <!-- Redirigimos a Operacion_pozo.html para volver a la lista de pozos -->
        <button class="btn" onclick="window.location.href='Operacion_pozo.html'" id="backBtn">
            <i class="fa-solid fa-arrow-left"></i> Regresar a lista de pozos
        </button>
      </div>

    </div> <!-- /.panel -->

  </div> <!-- /.page-content -->

  <!-- Pie de página estandarizado -->
  <footer>
    <small>
      <i class="fa-regular fa-copyright"></i> 
      Software desarrollado por el Instituto Interamericano de Tecnología y Ciencias del Agua.
    </small>
  </footer>

 <script>
    document.addEventListener("DOMContentLoaded", function () {
        const urlParams = new URLSearchParams(window.location.search);
        const idPozo = urlParams.get("id");

        if (!idPozo) {
            Swal.fire({
                icon: 'warning',
                title: 'Pozo no especificado',
                text: 'No se seleccionó ningún pozo para visualizar sus operaciones.'
            }).then(() => {
                window.location.href = 'Operacion_pozo.html';
            });
            return;
        }

        document.getElementById('link-historial').href =
            `Historial_operacion.html?pozo=${encodeURIComponent(idPozo)}`;

        const grid = document.querySelector('.cards-grid');
        const mensaje = (texto, color) =>
            `<div style="grid-column: 1/-1; text-align: center; color: ${color}; padding: 40px;">${texto}</div>`;

        function cargarPendientes() {
            // No existe /pendientes/pozo/{id}: se piden todos los pendientes y se filtra por pozo
            fetch(`${API_BASE_URL}/operacion/pendientes`)
                .then(response => {
                    if (!response.ok) throw new Error("Error al obtener operaciones");
                    return response.json();
                })
                .then(data => {
                    grid.innerHTML = '';

                    const operacionesFiltradas = (data || []).filter(op => op.idLp == idPozo);

                    if (operacionesFiltradas.length === 0) {
                        grid.innerHTML = mensaje('No hay operaciones pendientes para este pozo.', '#64748b');
                        return;
                    }

                    operacionesFiltradas.forEach(op => {
                        const id = op.id_op || op.id || 'N/A';
                        const pozo = op.op_cpozo || 'Sin Pozo';
                        const operador = op.op_operador || 'No asignado';

                        // LECTURA DEFENSIVA: Atrapamos cualquier variante que Spring Boot haya generado
                        const estadoOperando = op.op_operando || op.opOperando || op.op_Operando || op.operando || 'No';
                        const operando = String(estadoOperando).trim().toLowerCase();
                        const esActivo = operando === 'si' || operando === 'sí';

                        const colorBadge = esActivo ? '#28a745' : '#dc3545';
                        const textoBadge = esActivo ? 'Activo' : 'Inactivo';

                        const card = document.createElement('div');
                        card.className = 'registro-card';
                        card.innerHTML = `
                            <div class="registro-header">
                                <h3><i class="fa-solid fa-hashtag"></i> ID: ${escaparHtml(id)} - ${escaparHtml(pozo)}</h3>
                                <div>
                                    <span class="badge-actividad" style="background-color: ${colorBadge}; margin-right: 5px;">
                                        ${textoBadge}
                                    </span>
                                    <span class="badge-actividad">Pendiente</span>
                                </div>
                            </div>

                            <div class="registro-body">

                                <div class="detail-group">
                                    <span class="detail-label"><i class="fa-solid fa-clock"></i> Fecha y hora de registro</span>
                                    <span class="detail-value" style="font-size: 0.95rem;">${escaparHtml(formatearFechaHora(op.op_fecha_captura))}</span>
                                </div>

                                <div class="detail-group">
                                    <span class="detail-label"><i class="fa-solid fa-user-gear"></i> Operador</span>
                                    <span class="detail-value">${escaparHtml(operador)}</span>
                                </div>

                            </div>

                            <div class="registro-footer">
                                <a href="Registro_operacion.html?id=${encodeURIComponent(id)}" class="btn-ver">
                                    <i class="fa-solid fa-eye"></i> Ver Registro
                                </a>

                                <div class="acciones">
                                    <a href="#" title="Completar" class="icon-accept" data-accion="completar">
                                        <i class="fa-solid fa-square-check"></i>
                                    </a>
                                    <a href="Editar_Operacion.html?id=${encodeURIComponent(id)}" title="Editar" class="icon-edit">
                                        <i class="fa-solid fa-pen-to-square"></i>
                                    </a>
                                </div>
                            </div>
                        `;
                        card.querySelector('[data-accion="completar"]').addEventListener('click', e => {
                            e.preventDefault();
                            completarRegistro('operacion', id, cargarPendientes);
                        });
                        grid.appendChild(card);
                    });
                })
                .catch(error => {
                    console.error('Error al cargar operaciones:', error);
                    grid.innerHTML = mensaje('Error al cargar las operaciones desde el servidor.', '#dc3545');
                });
        }

        cargarPendientes();
    });
  </script>

</body>
</html>

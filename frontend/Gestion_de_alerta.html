<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Alertas - XibalbaData</title>
    
    <link rel="stylesheet" href="CSS/Menu_MAIN.css">
    
    <script src="https://kit.fontawesome.com/7f2bc339d8.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/sweetalert2@9.5.3/dist/sweetalert2.all.min.js"></script> 
    <script src="js/script.js" defer></script>
    <style>
      /* Tabla más ancha y con más aire en esta página */
      .table-scroll { width: 100%; overflow-x: auto; }
      .tabla { min-width: 1000px; }
      .tabla thead th, .tabla tbody td { padding: 14px 16px; }
      .tabla tbody td:nth-child(4) { white-space: nowrap; } /* fecha en una línea */
    </style>
</head>
<body>

  <!-- Contenedor principal que empuja el footer al fondo -->
  <div class="page-content">

    <div id="header-container"></div>

    <h1 class="main-title">Gestión de alertas</h1>

    <div class="panel">
      
      <div class="panel-header">
        <h2>Alertas recibidas</h2>
        <div style="display: flex; flex-wrap: wrap; gap: 10px;">
          <a href="Agregar_nueva_alerta.html" class="add-btn">
            <i class="fa-solid fa-square-plus"></i>
            Capturar nueva alerta
          </a>
          <a href="Historial_alertas.html" class="add-btn">
            <i class="fa-solid fa-clock-rotate-left"></i>
            Historial de alertas
          </a>
        </div>
      </div>

      <div class="table-scroll">
        <table class="tabla">
          <colgroup>
            <col width="5%">
            <col width="12%">
            <col width="14%">
            <col width="18%">
            <col width="17%">
            <col width="22%">
            <col width="12%">
          </colgroup>
          <thead>
            <tr>
              <th>ID</th>
              <th>Clave de pozo</th>
              <th>Tipo de alerta</th>
              <th>Fecha y hora de alerta</th>
              <th>Operador</th>
              <th>Observaciones de operador</th>
              <th>Alerta resuelta</th>
            </tr>
          </thead>
          <tbody id="tabla-alertas">
            <tr><td colspan="7">Cargando alertas...</td></tr>
          </tbody>
        </table>
      </div>

      <div class="button-container1">
        <button class="btn" onclick="menumain()" id="backBtn">
            <i class="fa-solid fa-arrow-left"></i>
            Regresar
        </button>
      </div>

    </div> <!-- /.panel -->

  </div> <!-- /.page-content -->

  <footer>
    <small>
      <i class="fa-regular fa-copyright"></i> 
      Software desarrollado por el Instituto Interamericano de Tecnología y Ciencias del Agua.
    </small>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
        const tbody = document.getElementById('tabla-alertas');
        const filaMensaje = (texto) => `<tr><td colspan="7">${texto}</td></tr>`;

        const getJson = (endpoint) => fetch(`${API_BASE_URL}/${endpoint}`).then(r => {
            if (!r.ok) throw new Error(`HTTP ${r.status}`);
            return r.json();
        });

        // Solo se muestran las alertas pendientes; las resueltas pasan a Historial_alertas.html
        function cargarAlertas() {
            tbody.innerHTML = filaMensaje('Cargando alertas...');

            Promise.all([
                getJson('alertas_pozos/pendientes'),
                cargarMapaOperadores()
            ]).then(([alertas, nombres]) => {
                if (!alertas || !alertas.length) {
                    tbody.innerHTML = filaMensaje('No hay alertas pendientes.');
                    return;
                }

                tbody.innerHTML = '';
                alertas.forEach(al => {
                    const id = al.id_al ?? '';
                    const operador = nombres[al.al_operador] ?? al.al_operador ?? '';
                    const fila = document.createElement('tr');
                    fila.dataset.alertaId = id;
                    fila.innerHTML = `
                        <td>${escaparHtml(id)}</td>
                        <td>${escaparHtml(al.al_clave_de_pozo)}</td>
                        <td>${escaparHtml(al.al_tipo_de_alerta)}</td>
                        <td>${escaparHtml(formatearFechaHora(al.al_fechacap, ''))}</td>
                        <td>${escaparHtml(operador)}</td>
                        <td>${escaparHtml(al.al_comentarios)}</td>
                        <td>
                            <a href="#" class="btn-resolver" data-alerta-id="${escaparHtml(id)}" title="Marcar como resuelta" style="margin-right: 12px;">
                              <i class="fa-solid fa-square-check action-icon" style="color: #28a745; font-size: 1.3rem;"></i>
                            </a>
                            <a href="Alerta_no_resuelta.html" data-alerta-id="${escaparHtml(id)}" title="Alerta no resuelta">
                              <i class="fa-solid fa-delete-left action-icon" style="color: #dc3545; font-size: 1.3rem;"></i>
                            </a>
                        </td>`;
                    tbody.appendChild(fila);
                });
            }).catch(err => {
                console.error('Error al cargar alertas:', err);
                tbody.innerHTML = filaMensaje('Error al cargar las alertas.');
            });
        }

        // Botón verde: confirma la resolución (operador + notas) y repinta la tabla
        tbody.addEventListener('click', function(e) {
            const boton = e.target.closest('.btn-resolver');
            if (!boton) return;
            e.preventDefault();
            confirmacion3(boton.dataset.alertaId, cargarAlertas);
        });

        cargarAlertas();
    });
  </script>

</body>
</html>

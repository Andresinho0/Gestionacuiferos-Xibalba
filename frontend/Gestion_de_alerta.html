<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Alertas - XibalbaData</title>
    
    <link rel="stylesheet" href="CSS/Menu_MAIN.css">
    
    <script src="https://kit.fontawesome.com/7f2bc339d8.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/sweetalert2@9.5.3/dist/sweetalert2.all.min.js"></script> 
    <script src="js/script.js" defer></script>
    <style>
      /* Tabla más ancha y con más aire en esta página */
      .table-scroll { width: 100%; overflow-x: auto; }
      .tabla { min-width: 1000px; }
      .tabla thead th, .tabla tbody td { padding: 14px 16px; }
      .tabla tbody td:nth-child(4) { white-space: nowrap; } /* fecha en una línea */
    </style>
</head>
<body>

  <!-- Contenedor principal que empuja el footer al fondo -->
  <div class="page-content">

    <div id="header-container"></div>

    <h1 class="main-title">Gestión de alertas</h1>

    <div class="panel">
      
      <div class="panel-header">
        <h2>Alertas recibidas</h2>
        <a href="Agregar_nueva_alerta.html" class="add-btn">
          <i class="fa-solid fa-square-plus"></i>
          Capturar nueva alerta
        </a>
      </div>

      <div class="table-scroll">
        <table class="tabla">
          <colgroup>
            <col width="5%">
            <col width="12%">
            <col width="14%">
            <col width="18%">
            <col width="17%">
            <col width="22%">
            <col width="12%">
          </colgroup>
          <thead>
            <tr>
              <th>ID</th>
              <th>Clave de pozo</th>
              <th>Tipo de alerta</th>
              <th>Fecha y hora de alerta</th>
              <th>Operador</th>
              <th>Observaciones de operador</th>
              <th>Alerta resuelta</th>
            </tr>
          </thead>
          <tbody id="tabla-alertas">
            <tr><td colspan="7">Cargando alertas...</td></tr>
          </tbody>
        </table>
      </div>

      <div class="button-container1">
        <button class="btn" onclick="menumain()" id="backBtn">
            <i class="fa-solid fa-arrow-left"></i>
            Regresar
        </button>
      </div>

    </div> <!-- /.panel -->

  </div> <!-- /.page-content -->

  <footer>
    <small>
      <i class="fa-regular fa-copyright"></i> 
      Software desarrollado por el Instituto Interamericano de Tecnología y Ciencias del Agua.
    </small>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
        const baseUrl = typeof API_BASE_URL !== 'undefined'
            ? API_BASE_URL
            : 'https://xibalbadata-java-production.up.railway.app/api';
        const tbody = document.getElementById('tabla-alertas');

        const esc = (t) => String(t ?? '').replace(/[&<>"']/g, c =>
            ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

        const getJson = (endpoint) => fetch(`${baseUrl}/${endpoint}`).then(r => {
            if (!r.ok) throw new Error(`HTTP ${r.status}`);
            return r.json();
        });

        Promise.all([
            getJson('alertas_pozos'),
            getJson('operadores').catch(() => [])
        ]).then(([alertas, operadores]) => {
            const nombres = {};
            operadores.forEach(o => { nombres[o.id_o] = o.o_nombre; });

            if (!alertas.length) {
                tbody.innerHTML = '<tr><td colspan="7">No hay alertas registradas.</td></tr>';
                return;
            }

            tbody.innerHTML = '';
            alertas.forEach(al => {
                const id = al.id_al ?? '';
                const fecha = al.al_fechacap ? new Date(al.al_fechacap).toLocaleString('es-MX') : '';
                const operador = nombres[al.al_operador] ?? al.al_operador ?? '';
                const fila = document.createElement('tr');
                fila.dataset.alertaId = id;
                // La columna "Alerta resuelta" se conserva: más adelante sus acciones
                // moverán la alerta a un historial (archivo por crear). data-alerta-id
                // deja listo el identificador para eso.
                fila.innerHTML = `
                    <td>${esc(id)}</td>
                    <td>${esc(al.al_clave_de_pozo)}</td>
                    <td>${esc(al.al_tipo_de_alerta)}</td>
                    <td>${esc(fecha)}</td>
                    <td>${esc(operador)}</td>
                    <td>${esc(al.al_comentarios)}</td>
                    <td>
                        <a href="#" onclick="confirmacion3()" data-alerta-id="${esc(id)}" title="Aceptar" style="margin-right: 12px;">
                          <i class="fa-solid fa-square-check action-icon" style="color: #28a745; font-size: 1.3rem;"></i>
                        </a>
                        <a href="Alerta_no_resuelta.html" data-alerta-id="${esc(id)}" title="Cancelar">
                          <i class="fa-solid fa-delete-left action-icon" style="color: #dc3545; font-size: 1.3rem;"></i>
                        </a>
                    </td>`;
                tbody.appendChild(fila);
            });
        }).catch(err => {
            console.error('Error al cargar alertas:', err);
            tbody.innerHTML = '<tr><td colspan="7">Error al cargar las alertas.</td></tr>';
        });
    });
  </script>

</body>
</html>

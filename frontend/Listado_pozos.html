<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="CSS/Menu_MAIN.css">
  <title>Listado de Pozos</title>

  <script src="https://kit.fontawesome.com/7f2bc339d8.js" crossorigin="anonymous"></script>
  <script src="js/Listado_pozos.js" defer></script>
  <style>
            .search-container {
            width: 52.5%;
            margin: 20px auto;
            text-align: center;
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .search-container input {
            width: 60%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-family: inherit;
            outline: none;
        }
  </style>
</head>

<body>

  <div class="page-content">

    <!-- Header -->
    <div id="header-container"></div>

    <h1 class="main-title">Listado de pozos</h1>
    <div class="panel">

      <div class="panel-header">
        <h2>Pozos registrados</h2>
        <div class="panel-actions">
          <a href="Nuevo_pozo.html" class="add-btn">
            <i class="fa-solid fa-square-plus"></i>
            Agregar pozo
          </a>
          <a href="Modificar_pozo.html" class="add-btn">
            <i class="fa-solid fa-pen-to-square"></i>
            Editar pozos
          </a>
        </div>
      </div>


      <!-- Buscador General de Pozos -->
      <div class="search-container" style="text-align: center; margin: 15px auto;">
        <label for="filtroGeneral" style="font-weight: bold; color: #004982; margin-right: 10px;">Buscar:</label>
        <input 
          type="text" 
          id="filtroGeneral" 
          oninput="filtrarPozos()" 
          placeholder="Buscar por clave o nombre del pozo..." 
          style="padding: 8px 12px; border-radius: 6px; border: 1px solid #cbd5e1; width: 50%; max-width: 400px; outline: none;"
        >
      </div>


      <!-- Tabla de pozos -->


    <!-- Tabla de pozos -->
      <div class="table-scroll" style="width: 100%; max-width: 700px; margin: 0 auto;">
        <table class="tabla" style="width: 100%;">
          <colgroup>
            <col width="25%">
            <col width="50%">
            <col width="25%">
          </colgroup>
          <thead>
            <tr>
              <th>Clave de pozo</th>
              <th>Nombre del pozo</th>
              <th>Información</th>
            </tr>
          </thead>
          <tbody id="pozosTableBody">
            <tr>
              <td colspan="3" class="empty-state">Cargando pozos…</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="button-container1">
        <button class="btn" onclick="iraMenu_Main()" id="backBtn">
          <i class="fa-solid fa-arrow-left"></i>
          Regresar
        </button>
      </div>

    </div>

  </div><!-- /.page-content -->

  <footer>
    <small>
      <i class="fa-regular fa-copyright"></i>
      Software desarrollado por el Instituto Interamericano de Tecnología y Ciencias del Agua.
    </small>
  </footer>


</body>
</html>

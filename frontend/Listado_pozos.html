<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="CSS/Menu_MAIN.css">
  <title>Listado de Pozos</title>

  <script src="https://kit.fontawesome.com/7f2bc339d8.js" crossorigin="anonymous"></script>
  <!-- <script src="js/script.js" defer></script> -->
  <script src="js/Listado_pozos.js" defer></script>
</head>

<body>

  <div class="page-content">

    <!-- Header -->
    <div id="header-container"></div>

    <h1 class="main-title">Listado de pozos</h1>
    <div class="panel">

      <div class="panel-header">
        <h2>Pozos registrados</h2>
        <div class="panel-actions">
          <a href="Nuevo_pozo.html" class="add-btn">
            <i class="fa-solid fa-square-plus"></i>
            Agregar pozo
          </a>
          <a href="Modificar_pozo.html" class="add-btn">
            <i class="fa-solid fa-pen-to-square"></i>
            Editar pozos
          </a>
        </div>
      </div>


      <!-- Filtros de búsqueda -->


      <div class="filters">
        <div class="filter-group">
          <label for="filtroProfundidadMin">Profundidad de perforación (m)</label>
          <div class="filter-range">
            <input type="number" id="filtroProfundidadMin" placeholder="Mín" min="0" step="any">
            <span>a</span>
            <input type="number" id="filtroProfundidadMax" placeholder="Máx" min="0" step="any">
          </div>
        </div>

        <div class="filter-group">
          <label for="filtroDiamPerfMin">Diámetro de perforación (in)</label>
          <div class="filter-range">
            <input type="number" id="filtroDiamPerfMin" placeholder="Mín" min="0" step="any">
            <span>a</span>
            <input type="number" id="filtroDiamPerfMax" placeholder="Máx" min="0" step="any">
          </div>
        </div>

        <div class="filter-group">
          <label for="filtroAdemeMin">Diámetro de ADEME (in)</label>
          <div class="filter-range">
            <input type="number" id="filtroAdemeMin" placeholder="Mín" min="0" step="any">
            <span>a</span>
            <input type="number" id="filtroAdemeMax" placeholder="Máx" min="0" step="any">
          </div>
        </div>

        <div class="filter-actions">
          <button type="button" class="btn-outline" id="limpiarFiltrosBtn">
            <i class="fa-solid fa-xmark"></i>
            Limpiar
          </button>
          <button type="button" class="btn" id="aplicarFiltrosBtn">
            <i class="fa-solid fa-filter"></i>
            Filtrar
          </button>
        </div>
      </div>



      <!-- Tabla de pozos -->


    <!-- Tabla de pozos -->
      <div class="table-scroll" style="width: 100%; max-width: 700px; margin: 0 auto;">
        <table class="tabla" style="width: 100%;">
          <colgroup>
            <col width="25%">
            <col width="50%">
            <col width="25%">
          </colgroup>
          <thead>
            <tr>
              <th>Clave de pozo</th>
              <th>Nombre del pozo</th>
              <th>Información</th>
            </tr>
          </thead>
          <tbody id="pozosTableBody">
            <tr>
              <td colspan="3" class="empty-state">Cargando pozos…</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="button-container1">
        <button class="btn" onclick="iraMenu_Main()" id="backBtn">
          <i class="fa-solid fa-arrow-left"></i>
          Regresar
        </button>
      </div>

    </div>

  </div><!-- /.page-content -->

  <footer>
    <small>
      <i class="fa-regular fa-copyright"></i>
      Software desarrollado por el Instituto Interamericano de Tecnología y Ciencias del Agua.
    </small>
  </footer>


</body>
</html>

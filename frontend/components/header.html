<header class="main-header">
    <a href="Menu_MAIN.html" class="logo-box" title="Ir al menú principal">

        <img src="img/xibalba_logo.png" class="logo-img">
    </a>

    <div class="header-actions">
        <!-- Notificaciones estilizadas como botón -->
        <div class="notification-container">
          <button type="button" class="nav-btn notification-btn" onclick="toggleNotifications()">
            <i class="fa-solid fa-bell"></i>
          </button>

          <!-- NUEVO: Perfil de Usuario -->
          <div class="notification-container">
            <button type="button" class="nav-btn notification-btn" onclick="toggleUserProfile()">
              <i class="fa-solid fa-circle-user"></i>
            </button>
          
          <!-- Menú desplegable del usuario -->
            <div class="notification-dropdown" id="userProfileDropdown">
              <div class="notification-item">
                <span id="display-nombre">Cargando...</span>
              </div>
              <div class="notification-item">
                <span id="display-matricula">Cargando...</span>
              </div>
              <div class="notification-item" style="text-transform: capitalize;">
                <span id="display-rol">Cargando...</span>
              </div>
            </div>
          </div>


          <!-- Buzón de notificaciones -->
        <div class="notification-dropdown" id="notificationDropdown">
            <div class="notification-item">Nueva notificación 1</div>
            <div class="notification-item">Nueva notificación 2</div>
            <div class="notification-item">Nueva notificación 3</div>
        </div>

        
            <a href="index.html" class="nav-btn logout-link">
                <i class="fa-solid fa-right-from-bracket"></i>

            </a>

        </div>
